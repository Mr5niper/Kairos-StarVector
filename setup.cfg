# setup.cfg (optional, improves editable install metadata)
[metadata]
name = stock-forecast
version = 0.1.0
description = Championship Stock Forecast Framework
license = MIT

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    numpy
    pandas
    scikit-learn
    scipy
    torch
    torchvision
    torchaudio
    statsmodels
    yfinance
    pyyaml
    tqdm
    lightgbm
    optuna
    skyfield
    transformers
    sentence-transformers
    feedparser
    streamlit
    plotly